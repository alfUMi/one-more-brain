name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Only used to generate the Prisma client; no database is needed for these checks.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Build the browser extension
        run: bun run --cwd apps/extension zip
        env:
          WXT_APP_URL: ${{ vars.APP_URL || 'http://localhost:3000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: one-more-brain-extension
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          # WXT writes to .output, a hidden folder that upload-artifact skips by default.
          include-hidden-files: true

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # The server this build signs in to and syncs with.
      VITE_APP_URL: ${{ vars.APP_URL || 'http://10.0.2.2:3000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: bun install --frozen-lockfile
      - name: Firebase config (push), when the secret is set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
      - name: Build the app and sync it into the Android project
        working-directory: apps/mobile
        run: bun run build && bunx cap sync android
      - name: Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: one-more-brain-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
