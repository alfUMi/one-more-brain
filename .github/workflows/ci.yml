name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Only used to generate the Prisma client; no database is needed for these checks.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Build the browser extension
        run: bun run --cwd apps/extension zip
        env:
          WXT_APP_URL: ${{ vars.APP_URL || 'http://localhost:3000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: one-more-brain-extension
          path: apps/extension/.output/*.zip
          if-no-files-found: error
